<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Katia Satranç</title><link rel="stylesheet" href="satranc.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js"></script><script defer src="https://unpkg.com/chess.js@0.10.3/chess.js"></script></head><body><main class="wrap"><header><button id="back">← Oyunlara dön</button><h1>♟ Katia Satranç</h1><span id="status">Beyaz oynar</span></header><nav><button data-mode="ai" class="active">🤖 Yapay zekâ</button><button data-mode="local">👥 Aynı cihaz</button><button data-mode="online">🌐 Çevrim içi</button></nav><section class="controls"><label>Renk <select id="color"><option value="w">Beyaz</option><option value="b">Siyah</option></select></label><label>Zorluk <select id="level"><option value="1">Kolay</option><option value="2" selected>Orta</option><option value="3">Zor</option></select></label><button id="new">Yeni oyun</button><button id="undo">Geri al</button><button id="flip">Tahtayı çevir</button></section><section class="game"><div id="board" aria-label="Satranç tahtası"></div><aside><h3>Hamleler</h3><ol id="moves"></ol><div id="online" hidden><button id="create">Oda oluştur</button><input id="room" maxlength="6" placeholder="Oda kodu"><button id="join">Odaya katıl</button><p id="roomInfo"></p></div><p class="hint">Taşına dokun, sonra hedef kareyi seç. Rok, geçerken alma, terfi, şah ve mat kuralları dahildir.</p></aside></section></main><script defer src="satranc.js"></script></body></html>
